<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquetas de la clasificación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Fira Sans',system-ui,sans-serif;background:#E5E7EB;color:#0F172A}
.switch{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#0F172A;color:#fff}
.switch b{font-weight:600;margin-right:8px;font-size:14px}
.switch button{border:1px solid #334155;background:#1E293B;color:#E2E8F0;padding:8px 14px;border-radius:8px;font:600 14px 'Fira Sans';cursor:pointer}
.switch button[aria-selected="true"]{background:#fff;color:#0F172A;border-color:#fff}
.switch button:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
section{display:none}section.on{display:block}
.num{font-family:'Fira Code',monospace;font-variant-numeric:tabular-nums}
.f{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font:700 11px 'Fira Sans';color:#fff}
.f-W{background:#16A34A}.f-D{background:#64748B}.f-L{background:#DC2626}
.fallback{display:inline-grid;place-items:center;border-radius:50%;background:#CBD5E1;color:#334155;font:700 11px 'Fira Sans';width:100%;height:100%}
.crest{display:inline-grid;place-items:center;flex:none}
.crest img{object-fit:contain;display:block}
/* ---------- A: claro y limpio ---------- */
.a{background:#F8FAFC;min-height:100vh;padding:32px 24px 56px}
.a .wrap{max-width:1040px;margin:0 auto}
.a .eyebrow{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1E40AF}
.a h1{margin:0 0 20px;font-size:44px;line-height:1.05;font-weight:800;color:#0F172A}
.a .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.a .kpi{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px 16px}
.a .kpi small{display:block;color:#475569;font-size:12px;font-weight:500;margin-bottom:8px}
.a .kpi .v{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.a .kpi .big{font-size:28px;font-weight:800;color:#1E40AF}
.a .panel{background:#fff;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden}
.a table{width:100%;border-collapse:collapse}
.a th{font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:12px 10px;background:#F1F5F9}
.a th:nth-child(2){text-align:left}
.a td{padding:10px;text-align:right;border-top:1px solid #EEF2F7;font-size:14px}
.a tr:hover td{background:#F8FAFC}
.a td.team{text-align:left}
.a .pos{position:relative;width:44px;font-weight:600;color:#334155;text-align:center}
.a .pos.top4::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#1E40AF}
.a .t{display:flex;align-items:center;gap:12px;font-weight:600}
.a .formcell{text-align:center;white-space:nowrap}.a .formcell .f{margin:0 2px}
.a .ptsbar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.a .ptsbar i{display:block;height:8px;border-radius:4px;background:#BFDBFE;min-width:6px}
.a .ptsbar b{width:28px;font-size:16px;color:#0F172A}
.a .legend{margin-top:12px;font-size:12px;color:#475569}
/* ---------- B: oscuro deportivo ---------- */
.b{background:#0B1220;color:#E2E8F0;min-height:100vh;padding:28px 24px 56px}
.b .wrap{max-width:1040px;margin:0 auto}
.b .bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.b h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.01em;color:#fff}
.b .pill{font-size:12px;font-weight:600;color:#C6F432;border:1px solid #3A4A12;background:#1A2308;padding:5px 12px;border-radius:999px}
.b .hero{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px;margin-bottom:16px}
.b .card{background:#111B2E;border:1px solid #1E2B44;border-radius:16px;padding:18px}
.b .lead{display:flex;gap:18px;align-items:center}
.b .lead .name{font-size:13px;color:#94A3B8;font-weight:500}
.b .lead h2{margin:2px 0 6px;font-size:26px;font-weight:800;color:#fff}
.b .lead .pts{font-size:56px;font-weight:800;line-height:1;color:#C6F432}
.b .lead .pts small{font-size:14px;color:#94A3B8;font-weight:500;margin-left:6px}
.b .stat small{display:block;color:#94A3B8;font-size:12px;font-weight:500;margin-bottom:10px}
.b .stat .big{font-size:36px;font-weight:800;color:#fff}
.b .stat .sub{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#CBD5E1}
.b .rows{display:grid;gap:6px}
.b .row{display:grid;grid-template-columns:34px 1fr 150px 130px 60px 64px;gap:12px;align-items:center;background:#111B2E;border:1px solid #1B2740;border-left:4px solid var(--c);border-radius:12px;padding:10px 14px}
.b .row:hover{background:#15223A}
.b .row .p{font-weight:700;color:#94A3B8;text-align:center}
.b .row.top .p{color:#C6F432}
.b .row .t{display:flex;align-items:center;gap:12px;font-weight:600;color:#fff}
.b .row .forms .f{margin-right:3px}
.b .row .gd{text-align:right;color:#94A3B8;font-size:14px}
.b .row .pt{text-align:right;font-size:22px;font-weight:700;color:#fff}
.b .head{display:grid;grid-template-columns:34px 1fr 150px 130px 60px 64px;gap:12px;padding:0 14px 8px 18px;font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:.06em}
/* ---------- C: tarjetas ---------- */
.c{background:#EEF2F7;min-height:100vh;padding:32px 24px 56px}
.c .wrap{max-width:1040px;margin:0 auto}
.c .top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.c h1{margin:0;font-size:38px;font-weight:800}
.c .top p{margin:6px 0 0;color:#475569;font-size:14px}
.c .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c .tcard{position:relative;background:#fff;border-radius:18px;padding:16px;overflow:hidden;border:1px solid #E2E8F0}
.c .tcard::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.c .tcard.first{grid-column:span 2;grid-row:span 2;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.c .tcard .rk{position:absolute;top:16px;right:16px;font-weight:800;font-size:13px;color:#475569}
.c .tcard .nm{margin:12px 0 2px;font-weight:700;font-size:16px}
.c .tcard.first .nm{font-size:26px;margin-top:16px}
.c .tcard .ven{font-size:12px;color:#64748B}
.c .tcard .pts{font-size:34px;font-weight:800;line-height:1;margin:10px 0 2px}
.c .tcard.first .pts{font-size:72px;color:var(--c)}
.c .tcard .rec{font-size:12px;color:#475569;margin-bottom:10px}
.c .tcard .fm{display:flex;gap:3px;margin-top:10px}
.c .tcard svg{display:block;width:100%;height:auto;margin-top:6px}
@media (max-width:760px){
 .a .kpis{grid-template-columns:repeat(2,1fr)}.a h1{font-size:32px}
 .a th:nth-child(n+5),.a td:nth-child(n+5){display:none}.a th:nth-child(4),.a td:nth-child(4){display:none}
 .b .hero{grid-template-columns:1fr}.b .row,.b .head{grid-template-columns:30px 1fr 56px}.b .row .forms,.b .row .gd,.b .head span:nth-child(3),.b .head span:nth-child(4),.b .head span:nth-child(5){display:none}
 .c .grid{grid-template-columns:repeat(2,1fr)}.c .tcard.first{grid-column:span 2;grid-row:auto}
}
</style>
</head>
<body>
<div class="switch" role="tablist" aria-label="Maquetas">
 <b>Elige una maqueta:</b>
 <button role="tab" aria-selected="true" data-t="a">A · Claro y limpio</button>
 <button role="tab" aria-selected="false" data-t="b">B · Oscuro deportivo</button>
 <button role="tab" aria-selected="false" data-t="c">C · Tarjetas</button>
</div>
<section id="a" class="on"></section><section id="b"></section><section id="c"></section>
<script src="data.js"></script>
<script>
const D = window.DATA, R = D.rows, leader = R[0];
const NAME = {W:'Victoria',D:'Empate',L:'Derrota'}, LET = {W:'V',D:'E',L:'D'};
const crest = (r, s) => `<span class="crest" style="width:${s}px;height:${s}px"><img src="${r.crest}" width="${s}" height="${s}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'${r.tla}'}))"></span>`;
const forms = r => r.form.map(x => `<span class="f f-${x}" title="${NAME[x]}">${LET[x]}</span>`).join('');
const spark = (s, color, w=160, h=44, stroke=2.5) => {
  const m = Math.max(...s, 1), st = w/(s.length-1);
  const pts = s.map((v,i)=>`${(i*st).toFixed(1)},${(h-4-(v/m)*(h-8)).toFixed(1)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución de puntos"><polyline fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.6" fill="${color}"/></svg>`;
};
const bestAtk = [...R].sort((a,b)=>b.gf-a.gf)[0], bestDef = [...R].sort((a,b)=>a.ga-b.ga)[0];
const gpm = (D.goals / D.played).toFixed(2);

// ---- A
document.getElementById('a').innerHTML = `<div class="a"><div class="wrap">
 <p class="eyebrow">Temporada ${D.season} · ${D.played} partidos jugados</p><h1>${D.league}</h1>
 <div class="kpis">
  <div class="kpi"><small>Líder</small><div class="v">${crest(leader,28)}<span>${leader.short}</span></div></div>
  <div class="kpi"><small>Mejor ataque</small><div class="v">${crest(bestAtk,28)}<span>${bestAtk.short}</span><span class="big num">${bestAtk.gf}</span></div></div>
  <div class="kpi"><small>Mejor defensa</small><div class="v">${crest(bestDef,28)}<span>${bestDef.short}</span><span class="big num">${bestDef.ga}</span></div></div>
  <div class="kpi"><small>Goles por partido</small><div class="v"><span class="big num">${gpm}</span></div></div>
 </div>
 <div class="panel"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>Forma</th><th>Puntos</th></tr></thead><tbody>
 ${R.map(r=>`<tr><td class="pos ${r.pos<=4?'top4':''} num">${r.pos}</td><td class="team"><div class="t">${crest(r,28)}${r.team}</div></td><td class="num">${r.played}</td><td class="num">${r.gd>0?'+':''}${r.gd}</td><td class="formcell">${forms(r)}</td><td><div class="ptsbar"><i style="width:${Math.round(r.points/leader.points*110)}px"></i><b class="num">${r.points}</b></div></td></tr>`).join('')}
 </tbody></table></div>
 <p class="legend">Barra azul a la izquierda: puestos de Champions. Los círculos son los últimos 5 partidos (V victoria, E empate, D derrota).</p>
</div></div>`;

// ---- B
document.getElementById('b').innerHTML = `<div class="b"><div class="wrap">
 <div class="bar"><h1>${D.league}</h1><span class="pill">Temporada ${D.season} · Jornada ${leader.played}</span></div>
 <div class="hero">
  <div class="card lead">${crest(leader,92)}<div><div class="name">Líder de la clasificación</div><h2>${leader.team}</h2><div class="pts num">${leader.points}<small>puntos</small></div></div></div>
  <div class="card stat"><small>Mejor ataque</small><div class="big num">${bestAtk.gf}</div><div class="sub">${crest(bestAtk,22)}${bestAtk.short}</div></div>
  <div class="card stat"><small>Mejor defensa</small><div class="big num">${bestDef.ga}</div><div class="sub">${crest(bestDef,22)}${bestDef.short}</div></div>
 </div>
 <div class="head"><span>#</span><span>Equipo</span><span>Evolución</span><span>Forma</span><span style="text-align:right">DG</span><span style="text-align:right">Pts</span></div>
 <div class="rows">
 ${R.map(r=>`<div class="row ${r.pos<=4?'top':''}" style="--c:${r.color}"><span class="p num">${r.pos}</span><span class="t">${crest(r,30)}${r.short}</span><span>${spark(r.series,'#C6F432',130,30,2)}</span><span class="forms">${forms(r)}</span><span class="gd num">${r.gd>0?'+':''}${r.gd}</span><span class="pt num">${r.points}</span></div>`).join('')}
 </div></div></div>`;

// ---- C
document.getElementById('c').innerHTML = `<div class="c"><div class="wrap">
 <div class="top"><div><h1>${D.league}</h1><p>Temporada ${D.season} · ${D.played} partidos · ${D.goals} goles</p></div></div>
 <div class="grid">
 ${R.slice(0,9).map((r,i)=>`<article class="tcard ${i===0?'first':''}" style="--c:${r.color}"><span class="rk num">#${r.pos}</span>
  <div>${crest(r,i===0?84:44)}<div class="nm">${r.team}</div><div class="ven">${r.venue||''}</div></div>
  <div><div class="pts num">${r.points}<span style="font-size:${i===0?20:12}px;font-weight:500;color:#64748B"> pts</span></div>
  <div class="rec num">${r.won}V · ${r.drawn}E · ${r.lost}D · DG ${r.gd>0?'+':''}${r.gd}</div>
  ${spark(r.series, r.color, i===0?340:160, i===0?90:44, i===0?3.5:2.5)}
  <div class="fm">${forms(r)}</div></div></article>`).join('')}
 </div></div></div>`;

document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.switch button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  window.scrollTo(0,0);
}));
</script>
</body>
</html>
