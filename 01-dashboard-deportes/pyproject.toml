[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-dashboard"
version = "0.1.0"
description = "Football data pipeline and web dashboard"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
# Reglas fijadas en el repositorio para que local y CI den el mismo resultado.
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
# Las consultas SQL largas se leen mejor en una línea.
ignore = ["E501"]
